<style>
  :root{
    --blue:#1b5e9c;
    --ink:#1f2630;
    --ink-soft:#55606e;
    --paper:#f7f3ea;
    --line:#e0d8c6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1200px;height:630px;}
  body{
    font-family:'Inter',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--paper);
    background-image:
      radial-gradient(ellipse 70% 60% at 88% 6%, rgba(27,94,156,0.10), transparent 60%),
      radial-gradient(ellipse 60% 50% at 4% 96%, rgba(27,94,156,0.07), transparent 60%);
    overflow:hidden;
  }
  .card{
    width:1200px;height:630px;
    padding:72px 80px;
    display:flex;flex-direction:column;
    border:3px solid var(--ink);
    border-radius:20px;
    position:relative;
  }
  .bar{
    position:absolute;left:0;top:0;bottom:0;width:14px;
    background:var(--blue);
    border-radius:18px 0 0 18px;
  }
  .kicker{
    display:flex;align-items:center;gap:16px;
    font-weight:600;font-size:26px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--blue);
  }
  .mark{width:46px;height:46px;object-fit:contain;}
  h1{
    font-family:'Fraunces','Georgia',serif;
    font-weight:600;
    font-size:62px;
    line-height:1.04;
    margin-top:34px;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .excerpt{
    font-size:32px;line-height:1.42;
    color:var(--ink-soft);
    margin-top:30px;
    max-width:1000px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .footer{
    margin-top:auto;
    display:flex;align-items:center;justify-content:space-between;
    padding-top:28px;
    border-top:2px solid var(--line);
    font-size:27px;color:var(--ink-soft);
  }
  .footer .site{font-weight:600;color:var(--ink);}
  .footer .domain{color:var(--blue);font-weight:600;}
</style>
