<div class="ed-tweets-section">
  <div class="ed-section-label">Latest Tweets</div>
  <div class="ed-tweets-list" id="twitter-feed-sidebar">
    <p class="ed-loading">Loading tweets...</p>
  </div>
</div>

<!-- Hidden Twitter post data for JavaScript -->
<div style="display: none;">
{% if site.data.twitter-posts %}
{% for post in site.data.twitter-posts %}
  <div class="twitter-post-data"
       data-title="{{ post.title | xml_escape }}"
       data-excerpt="{{ post.excerpt | xml_escape }}"
       data-url="{{ post.url }}"
       data-date="{{ post.date | date_to_xmlschema }}">
  </div>
{% endfor %}
{% endif %}
</div>

<script>
// Render Twitter feed in sidebar
function renderTwitterSidebar() {
  var container = document.getElementById('twitter-feed-sidebar');
  if (!container) return;

  var posts = [];
  var postElements = document.querySelectorAll('.twitter-post-data');

  postElements.forEach(function(el) {
    posts.push({
      title: el.dataset.title,
      excerpt: el.dataset.excerpt,
      url: el.dataset.url,
      date: new Date(el.dataset.date),
      tweetId: el.dataset.url.split('/').pop()
    });
  });

  // Sort by tweet ID (snowflake, chronological), newest first
  posts.sort(function(a, b) {
    var idA = BigInt(a.tweetId);
    var idB = BigInt(b.tweetId);
    return idB > idA ? 1 : -1;
  });

  if (posts.length === 0) {
    container.innerHTML = '<p class="ed-loading">No tweets yet.</p>';
    return;
  }

  var html = posts.map(function(post) {
    var dateStr = post.date.toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric',
      year: 'numeric'
    });

    var text = (post.excerpt || post.title).replace(/https?:\/\/\S+/g, '').replace(/\s+/g, ' ').trim();

    return '<div class="ed-tweet-item">' +
      '<p class="ed-tweet-text"><a href="' + post.url + '" target="_blank" rel="noopener noreferrer">' + text + '</a></p>' +
      '<p class="ed-tweet-date">' + dateStr + '</p>' +
    '</div>';
  }).join('');

  container.innerHTML = html;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderTwitterSidebar);
} else {
  renderTwitterSidebar();
}
</script>
