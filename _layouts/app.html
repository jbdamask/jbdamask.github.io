---
layout: default
---

<style>
  /* Full-width layout for app pages */
  .page {
    max-width: 100% !important;
    padding: 0 !important;
  }

  .page__content {
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .page__inner-wrap {
    max-width: 100% !important;
    margin: 0 !important;
  }

  /* Remove default content padding */
  article.page {
    padding: 0 !important;
  }

  /* Ensure full width for embedded app content */
  .page__content > * {
    max-width: 100% !important;
  }
</style>

<article class="page" itemscope itemtype="https://schema.org/CreativeWork">
  <div class="page__inner-wrap">
    <section class="page__content" itemprop="text">
      {{ content }}
    </section>
  </div>
</article>
