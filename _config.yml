# Site settings
title: Don't over(look|state) the obvious
subtitle: John Damask's personal site
email: jbdamask@gmail.com
description: Personal blog and website
baseurl: ""
url: "https://jbdamask.github.io"
repository: "jbdamask/jbdamask.github.io"
locale: "en-US"

# Author information
author:
  name: John Damask
  email: jbdamask@gmail.com
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jbdamask"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/jbdamask"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/johndamask"
    - label: "Medium"
      icon: "fab fa-fw fa-medium"
      url: "https://medium.com/@jbdamask"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes@4.24.0
minimal_mistakes_skin: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-remote-theme

# Pagination
paginate: 5
paginate_path: /page:num/

# Reading Files
include:
  - .htaccess
  - _pages
  - tools

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .DS_Store

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # tools documentation
  - scope:
      path: "tools"
      type: pages
    values:
      layout: tool
      author_profile: false
