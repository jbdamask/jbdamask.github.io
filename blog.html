---
layout: page
title: Blog
subtitle: All posts
show_sidebar: false
---

<div class="content">
  {% for post in site.posts %}
    <article class="media">
      <div class="media-content">
        <div class="content">
          <p>
            <a href="{{ post.url | relative_url }}"><strong>{{ post.title }}</strong></a>
            <br>
            <small>{{ post.date | date: "%B %-d, %Y" }}</small>
            <br>
            {{ post.excerpt }}
          </p>
        </div>
      </div>
    </article>
  {% endfor %}
</div>
